vocabulary_id: building_systems
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original
anchor_standard_version: null
hierarchy: two_level
multi_select: true
governance_notes: |
  TWT-original system/element taxonomy. Used to tag what physical systems and
  building elements are within a project's scope. Functionally informed by
  UniFormat Level 2 element categorization, but uses TWT-original category
  names without reproducing CSI's protected expression.

  Multi-select. Most projects involve many building systems simultaneously.
  Distinct from construction_scope.yaml which captures specification-divisional
  scope; this vocabulary captures functional systems regardless of how they
  show up in a spec book.
future_migration:
  target_anchor: csi_uniformat
  target_version: UniFormat 2010 or current
  trigger: v1.0 product gate, CSI Dynamic Standards data licensing acquired
  migration_artifact: crosswalks/building_systems_twt_to_uniformat.yaml (planned)

