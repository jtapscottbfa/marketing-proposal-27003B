vocabulary_id: sub_discipline
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original (SF330-informed)
anchor_standard_version: null
hierarchy: two_level
multi_select: true
governance_notes: |
  Granular sub-disciplines under each top-level discipline in discipline.yaml.
  Used for personnel matrix filtering and project scope breakdown. Multi-select
  because most projects involve multiple sub-disciplines within a discipline
  (a typical MEP project covers HVAC, plumbing, fire protection, power, and
  lighting at minimum).

  parent_id references entries in discipline.yaml. This vocabulary is
  TWT-original at the granularity level used; SF330 stops at the top-level
  discipline and does not standardize sub-disciplines.
future_migration: null

