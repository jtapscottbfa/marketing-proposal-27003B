vocabulary_id: tag_aliases
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original
tenant_scope: bfa
governance_notes: |
  Alias map for normalizing tenant freeform tags at write time. Variants on the
  left, canonical form on the right.

  Per the v0.0.2 build digest: freeform tags are reviewed monthly. Useful tags
  promote into a controlled vocabulary (with their own canonical_id and
  aliases). Aliases here cover only the gap between tenant-typed variants and
  the canonical freeform tag.

  This file is a STARTER seed only. Most aliases will be added incrementally as
  the corpus grows and patterns emerge. The extractor and reviewer can suggest
  new alias entries when they encounter variants not yet mapped.

  Distinct from the per-vocabulary aliases inside each controlled vocabulary
  YAML — those map source-document text into controlled vocabulary entries.
  This map normalizes the OPEN tenant_freeform_tags space.

  Alias resolution is case-insensitive. Whitespace is normalized to underscores.

# ============ STRUCTURE ============
# Each entry maps one or more variants to a canonical tag.
#
# canonical_tag: <snake_case canonical form>
#   variants:
#     - <variant string 1>
#     - <variant string 2>
#   notes: <optional context>

