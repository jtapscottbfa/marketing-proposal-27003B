vocabulary_id: role_on_project
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original
anchor_standard_version: null
hierarchy: flat
multi_select: true
governance_notes: |
  Captures BFA's role on a project. Used for both the project-level
  bfa_role field and (in future personnel library) for individual
  personnel role-on-project tagging.

  Multi-select because BFA's role can span multiple categories (prime
  consultant on design AND owner's representative during construction;
  joint venture partner AND specialty consultant for one discipline).

  Distinct from key personnel ROLE assignments within a project (PM,
  Principal in Charge, Lead Architect) which are personnel-specific titles.
future_migration: null

entries:
