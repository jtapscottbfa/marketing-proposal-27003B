vocabulary_id: contract_vehicle
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original (aggregated from federal, state, commercial usage)
anchor_standard_version: null
hierarchy: two_level
multi_select: true
governance_notes: |
  Contract vehicle captures the procurement instrument under which a project is
  awarded. Distinct from delivery_method (DBB vs DB vs CMAR) — a CMAR project
  can be procured via IDIQ task order or as a standalone project.

  Multi-select because some projects are awarded under multiple vehicles
  (a task order under a MATOC contract is both task_order and matoc).
future_migration: null

entries:
