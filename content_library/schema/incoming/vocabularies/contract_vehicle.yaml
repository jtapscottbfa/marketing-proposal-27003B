  - canonical_id: standalone_project
    display_name: Standalone Project
    definition: Project procured and contracted as a single, project-specific contract (not under any IDIQ/MATOC).
    parent_id: null
    aliases:
      - standalone
      - single_project
      - project_specific_contract
    standard_reference: null

