vocabulary_id: change_order_reason
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original
anchor_standard_version: null
hierarchy: flat
multi_select: true
governance_notes: |
  Change order reason categories. Used to tag the reason for each change order
  on a project so that BFA can analyze patterns (e.g., "what fraction of our
  CO value came from owner-directed scope additions vs. design errors").

  Multi-select per change order — a single CO can have multiple contributing
  reasons (scope addition triggered by an unforeseen condition).

  This taxonomy is intentionally honest, including categories like
  design_error_omission. The library's value depends on accurate categorization
  not defensive categorization. Internal use only; not all categories should
  surface in client-facing past performance writeups.
future_migration: null

