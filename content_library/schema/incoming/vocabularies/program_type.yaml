vocabulary_id: program_type
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original
anchor_standard_version: null
hierarchy: three_level
multi_select: true
governance_notes: |
  Captures what kind of facility the project IS, independent of who is paying.
  A federal hospital and a private hospital share program_type=medical_hospital.
  Three levels: top-level program, mid-level subtype, optional specialization.
  Most projects use top + subtype; specialization is for projects with
  distinguishing features that matter for past-performance matching.

  Multi-select supported because mixed-use and complex programs commonly span
  multiple program types. A K-12 with a community recreation center is both
  education_k12 and recreational_community.
future_migration: null

