vocabulary_id: construction_scope
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original
anchor_standard_version: null
hierarchy: two_level
multi_select: true
governance_notes: |
  TWT-original scope-of-work taxonomy. Used to tag what construction work scope
  is included in a project from a contractor/specification perspective.
  Functionally informed by MasterFormat 2020 divisional structure but uses
  TWT-original category names without reproducing CSI's protected expression
  or section numbers.

  Multi-select. Distinct from building_systems.yaml — that vocabulary captures
  what's in the building, this vocabulary captures what's in the contractor's
  scope. The two overlap heavily but serve different gate queries.
future_migration:
  target_anchor: csi_masterformat
  target_version: MasterFormat 2020 or current
  trigger: v1.0 product gate, CSI Dynamic Standards data licensing acquired
  migration_artifact: crosswalks/construction_scope_twt_to_masterformat.yaml (planned)

