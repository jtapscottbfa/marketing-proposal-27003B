vocabulary_id: client_type
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: NAICS-informed (sector classification)
anchor_standard_version: NAICS 2022
hierarchy: two_level
multi_select: true
governance_notes: |
  Captures who is paying for and contracting the project. Distinct from
  program_type (what kind of facility). A federal K-12 school is
  client_type=federal, program_type=education_k12. Top-level entries are the
  primary classification used by federal proposal evaluators ("have you done
  federal work"); sub-level entries provide additional specificity where
  meaningful (e.g., DoD vs civilian federal, state DOT vs general state).
future_migration: null

entries:
  # ============ FEDERAL ============
  - canonical_id: federal
    display_name: Federal
    definition: Project funded and/or contracted by a US federal agency.
    parent_id: null
    aliases:
      - federal_government
      - usg
      - us_government
    standard_reference: null

  - canonical_id: federal_civilian
    display_name: Federal — Civilian Agency
    definition: Federal project under a non-DoD civilian agency (GSA, VA, NPS, USDA, DOE, etc.).
    parent_id: federal
    aliases:
      - civilian_federal
    standard_reference: null

  - canonical_id: federal_dod
    display_name: Federal — Department of Defense
    definition: Federal project under DoD or a military service branch (Army, Navy, Air Force, USMC, USCG, Space Force).
    parent_id: federal
    aliases:
      - dod
      - department_of_defense
      - military
    standard_reference: null

  - canonical_id: federal_va
    display_name: Federal — Department of Veterans Affairs
    definition: Federal project for the VA, including VA medical centers and CBOCs.
    parent_id: federal
    aliases:
      - va
      - veterans_affairs
    standard_reference: null

  - canonical_id: federal_gsa
    display_name: Federal — General Services Administration
    definition: Federal project under GSA (federal building portfolio, courthouses, leased space).
    parent_id: federal
    aliases:
      - gsa
    standard_reference: null

  - canonical_id: federal_usace
    display_name: Federal — US Army Corps of Engineers
    definition: Federal project executed by USACE, including civil works and military construction support.
    parent_id: federal
    aliases:
      - usace
      - corps_of_engineers
      - army_corps
    standard_reference: null

  - canonical_id: federal_navfac
    display_name: Federal — Naval Facilities Engineering Systems Command
    definition: Federal project executed by NAVFAC for Navy and Marine Corps facilities.
    parent_id: federal
    aliases:
      - navfac
    standard_reference: null

  - canonical_id: federal_afcec
    display_name: Federal — Air Force Civil Engineer Center
    definition: Federal project executed by AFCEC for Air Force facilities.
    parent_id: federal
    aliases:
      - afcec
    standard_reference: null

  - canonical_id: federal_intelligence
    display_name: Federal — Intelligence Community
    definition: Federal project for IC agencies (often classified clients; CIA, NSA, NRO, NGA, ODNI).
    parent_id: federal
    aliases:
      - ic
      - intelligence_community
    standard_reference: null

  - canonical_id: federal_dhs
    display_name: Federal — Department of Homeland Security
    definition: Federal project for DHS components (CBP, USCG, FEMA, USCIS, etc.).
    parent_id: federal
    aliases:
      - dhs
    standard_reference: null

  # ============ STATE / LOCAL ============
  - canonical_id: state
