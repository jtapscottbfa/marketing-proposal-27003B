vocabulary_id: project_status
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: twt-original
anchor_standard_version: null
hierarchy: flat
multi_select: false
governance_notes: |
  Project lifecycle status. Single-select per project — a project is in one
  lifecycle state at a time. Status changes over time and may need to be
  updated periodically as projects progress.

  States are designed to support past-performance gate queries:
  - "Show me all complete projects" → complete
  - "Show me everything won" → awarded, in_design, design_complete, in_construction, substantially_complete, complete, won_not_yet_mobilized
  - "Show me active work" → in_design, in_construction, substantially_complete

  Lost/cancelled projects are retained in the library for lessons-learned and
  to capture pursuit history.
future_migration: null

