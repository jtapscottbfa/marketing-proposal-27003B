vocabulary_id: procurement_type
vocabulary_version: 1.0.0
last_updated: 2026-05-04
anchor_standard: FAR-derived (federal); state/local/commercial common usage
anchor_standard_version: FAR (current edition, public)
hierarchy: two_level
multi_select: true
governance_notes: |
  Procurement type captures HOW the project was solicited and what eligibility
  rules applied — distinct from award_type (qualifications-based vs best-value
  vs low-bid) and from contract_vehicle (the contractual instrument used).

  Federal entries derived from FAR Part 19 (small business programs) and FAR
  Part 6 (competition requirements). FAR is public.

  Multi-select because a single procurement can carry multiple attributes
  (e.g., 8(a) sole source AND simplified acquisition).
future_migration: null

entries:
  # ============ FEDERAL ============
  - canonical_id: federal
    display_name: Federal
    definition: Project procured under federal acquisition rules.
    parent_id: null
    aliases:
      - federal_procurement
    standard_reference: FAR

  - canonical_id: federal_full_and_open
    display_name: Federal — Full and Open Competition
    definition: Federal procurement open to all responsible offerors per FAR Part 6.
    parent_id: federal
    aliases:
