anchor_standard: SF330 Section E (Architect-Engineer Qualifications)
anchor_standard_version: SF330 (current)
hierarchy: flat
multi_select: true
governance_notes: |
  Top-level engineering and design disciplines. Anchored on SF330 Section E
  discipline list, which is the federal standard reference for personnel
  qualifications on A-E projects. Sub-disciplines are captured separately in
  sub_discipline.yaml for finer granularity.

  SF330 is a public form usable without licensing. Display names follow SF330
  conventions where applicable.
future_migration: null

